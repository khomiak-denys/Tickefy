name: Test

on:
    push:
        branches: [ "dev", "main" ]
    pull_request:
        branches: [ "dev", "main" ]
    workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build -c Release --no-restore
      
    - name: Test
      run: dotnet test -c Release --no-build --logger "GitHubActions;summary.includePassedTests=true" --logger "console;verbosity=minimal" --logger trx --results-directory ./TestResults
    - name: Publish Test Summary
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: .NET Tests Summary
        path: ./TestResults/*.trx
        reporter: dotnet-trx
